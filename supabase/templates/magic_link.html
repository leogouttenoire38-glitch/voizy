<!doctype html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #1c1c28; background: #f8f8fc; margin: 0; padding: 24px;">
    <div style="max-width: 420px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 28px; border: 1px solid #ececf3;">
      <p style="font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #2e6b4f; margin: 0 0 16px;">VOIZY</p>

      <p style="font-size: 14px; color: #5c5c6e; line-height: 20px; margin: 0 0 20px;">
        Votre code de connexion&nbsp;:
      </p>
      <p style="font-size: 30px; font-weight: 800; letter-spacing: 10px; text-align: center; margin: 0 0 20px; color: #1c1c28;">{{ .Token }}</p>
      <p style="font-size: 13px; color: #5c5c6e; line-height: 19px; margin: 0;">
